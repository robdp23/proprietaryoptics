<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rob Pearson</title>
  <meta name="description" content="Rob Pearson. An isometric studio backlot.">
  <meta name="theme-color" content="#0c0d10">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="lot.css?v=4">
</head>
<body>
<div class="lot-root">

<div class="work">
  <main id="stage">
    <header class="bar">
      <h1 class="brand">Rob Pearson <span>Backlot</span></h1>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="tools">
        <button class="toggle" id="lightBtn" type="button" title="Time of day. Auto follows your clock">Auto</button>
        <button class="toggle" id="crtBtn" type="button" aria-pressed="false" title="Scanlines and colour fringing">CRT</button>
        <button class="toggle" id="dbgBtn" type="button" hidden aria-pressed="false" title="Show hitboxes (D)">Hitboxes</button>
      </div>
    </header>
    <canvas id="gl" aria-label="Isometric map of a studio backlot. Use the section buttons above to open each area."></canvas>
    <div id="labels"></div>
    <div class="callsheet">
      <button type="button" id="sheetBtn" aria-expanded="false" aria-controls="sheetBox">Call sheet 0/5</button>
      <div id="sheetBox" hidden>
        <ul id="sheetList"></ul>
        <button type="button" id="sheetReset">Reset</button>
      </div>
    </div>
    <div class="zoom">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
    </div>
    <div class="hint" id="hint">Click a building to walk there. Drag to look around.</div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="debug" id="debug" hidden>
      <p id="coords">Map px: move the pointer</p>
      <p>Click the map to record polygon points.</p>
      <textarea id="pts" aria-label="Recorded points" readonly></textarea>
      <button type="button" id="ptsClear">Clear points</button>
    </div>
    <div id="veil">
      <div class="veil-copy">
        <p class="veil-kicker">A studio backlot</p>
        <p class="veil-mark">Rob Pearson</p>
        <p class="veil-wait">Loading the lot</p>
        <div class="veil-track" role="progressbar" aria-label="Loading"><div id="veilBar"></div></div>
      </div>
    </div>
  </main>

  <aside id="panel" aria-labelledby="panelTitle" hidden>
    <div class="sheet-head">
      <h2 id="panelTitle" tabindex="-1"></h2>
      <button class="close" id="panelClose" type="button">Close</button>
    </div>
    <div id="panelBody"></div>
  </aside>
</div>

<template id="tpl-reel">
  <div class="frame is-player">
    <iframe title="Rob Pearson demo reel" src="https://player.vimeo.com/video/267294774?color=c9a96e&title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  </div>
  <p>Feature film and episodic work. Simulations, lighting, look development, and the pipeline around them.</p>
</template>

<template id="tpl-fx">
  <p>Creative technologist with 20 years in feature-film visual effects, from effects TD at Industrial Light & Magic and Weta Digital to Effects Head of Department at DNEG and CG Supervisor at Pixomondo. The work sits between the shot and the pipeline: simulations, look, and the tools a crew actually runs on.</p>
  <p>Lately that same habit has gone into generative AI and rapid prototyping. Multi-agent systems, local models, and small production tools, built the way the studio ones were: find the friction, ship something people use.</p>
</template>

<template id="tpl-tools">
  <p>Custom tools built across productions, open to share on request. Built for Houdini, Deadline, ShotGrid, and general VFX pipeline workflows.</p>
  <h3>Image Comparison</h3>
  <p>Side-by-side render comparison with three modes: wipe, onion skin, and a pixel-difference heatmap. Runs as a local Python server with a Windows Explorer menu, so two images can be compared from a right-click.</p>
  <p class="tags">Python · HTML Canvas · Windows · Local server</p>
  <h3>Farm Analytics</h3>
  <p>Self-contained HTML dashboards from Deadline CSV exports. Daily render hours, per-job breakdown, ShotGrid fallback, and site filtering, on Windows and Linux through Rez.</p>
  <p class="tags">Python · ECharts · Deadline · Rez · ShotGrid</p>
  <h3>Storage Analytics</h3>
  <p>Cleans TreeSize exports, then builds an interactive breakdown of disk use by department and show. No external services required.</p>
  <p class="tags">Python · ECharts · XLS · LibreOffice</p>
  <h3>Seq QC Submit</h3>
  <p>A PySide2 tool for sequence-level QC renders outside Houdini. It builds a LOP network per shot and submits to Deadline with frame ranges and cameras from ShotGrid.</p>
  <p class="tags">Python · PySide2 · Houdini · ShotGrid · Deadline</p>
</template>

<template id="tpl-resume">
  <p>The resume is sent on request, usually the same day.</p>
  <form id="resumeForm" class="resume-form">
    <label>Name<input name="name" type="text" autocomplete="name" required></label>
    <label>Email<input name="email" type="email" autocomplete="email" required></label>
    <label>Message<textarea name="message" rows="4" required placeholder="A note about the role or the show."></textarea></label>
    <button type="submit">Send request</button>
  </form>
